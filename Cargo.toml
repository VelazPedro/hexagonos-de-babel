[workspace]
members = ["core"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
babel_core = { path = "core" }
rand_chacha = "=0.10.0"
blake3 = "=1.8.7"
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
aho-corasick = "=1.1.5"
serde = { version = "=1.0.229", features = ["derive"] }
ron = "=0.12.3"
proptest = "=1.12.0"

[package]
name = "hexagonos_de_babel"
version.workspace = true
edition.workspace = true

[dependencies]
babel_core.workspace = true
bevy = { version = "=0.20.1", default-features = false, features = [
    "2d_bevy_render",
    "default_app",
    "std",
    "bevy_winit",
    "bevy_gilrs",
    "multi_threaded",
    "x11",
    "bevy_audio",
    "wav",
    "png",
] }
serde.workspace = true
ron.workspace = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
# No symbols or debug paths in the distributed program.
strip = true
